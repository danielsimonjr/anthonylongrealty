# This workflow does not enable GitHub Pages. A person must choose "GitHub Actions"
# as the Pages source in the repository settings before the first deploy can succeed;
# until then the deploy step fails and nothing is published.
# The owner approved publishing at https://danielsimonjr.com/anthonylongrealty/, so this
# runs on push to main as well as by hand. It must never run on pull_request.
name: Deploy Pages

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node scripts/guard.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
